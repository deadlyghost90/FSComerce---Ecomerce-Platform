function table(rows,heads){return `<div class="table-wrap"><table class="table"><thead><tr><th><input type="checkbox" data-all></th>${heads.map(h=>`<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><input class="row-check" type="checkbox"></td>${r.map((x,j)=>`<td>${j===0?`<span class="name">${esc(x)}</span>`:j===r.length-1?`<span class="status ${String(x).toLowerCase().includes('low')||String(x).toLowerCase().includes('process')?'warn':''}">${esc(x)}</span>`:esc(x)}</td>`).join('')}<td><button class="top-btn" data-toast="Row actions opened">···</button></td></tr>`).join('')}</tbody></table></div><div class="pagination"><button>‹</button><button class="active">1</button><button>2</button><button>3</button><button>›</button></div>`}
function header(sub='Manage your store from one place.'){return `<div class="page-title"><div><h1>${esc(title)}</h1><p>${sub}</p></div><div class="actions"><button class="btn" data-export>↓ Export</button><button class="btn" data-action="filter">☷ Filter</button><button class="btn primary" data-action="create">＋ Create</button></div></div>`}function home(){return `<div class="page-title"><div><h1>Good morning, Ludvig</h1><p>Here is the latest overview of your store.</p></div><div class="actions"><select class="select"><option>Today</option><option>Last 7 days</option><option>Last 30 days</option><option>Last 90 days</option></select><button class="btn primary" data-action="create">＋ Create order</button></div></div>${metrics()}<div class="section-grid"><div><div class="card"><div class="card-head"><div><h2>Sales over time</h2><small>Compare previous period · Daily / Weekly / Monthly</small></div><span class="status">Live</span></div>${chart()}</div><div class="card" style="margin-top:14px"><div class="card-head"><h2>Recent orders</h2><a class="muted" href"admin/orders.html/index,home">View all →</a></div>${table(db.orders.map((x,i)=>[x,'Sep '+(17-i)+', 2025',['Kasper Kristensen','Olivia Martin','Arthur Chen','Maya Patel'][i%4],'Online','Paid','Shipped',i+1,'€'+(1300-i*120)+'.00']),['Order','Date','Customer','Channel','Payment','Fulfillment','Items','Total'])}</div></div><div><div class="card"><div class="card-head"><h2>Recent activity</h2></div>${timeline()}</div><div class="card" style="margin-top:14px"><div class="card-head"><h2>Low stock</h2></div><div class="list">${db.products.slice(0,4).map((x,i)=>`<div class="list-row"><span class="thumb green">${x[0]}</span><div class="copy"><b>${x}</b><small>SKU-10${48-i} · ${i+2} units remaining</small></div><span class="status warn">Low stock</span></div>`).join('')}</div></div></div></div><div class="grid" style="margin-top:14px">${['Sales by channel','Sales by country','Traffic sources','Fulfillment status'].map((x,i)=>`<div class="card"><div class="card-head"><h2>${x}</h2></div><div class="card-body"><strong>${['€24,102','€18,442','42,891','1,284'][i]}</strong><p class="muted">↑ ${12+i*3}.4% this period</p><div class="callout">Online Store 68% · POS 21% · Mobile 11%</div></div></div>`).join('')}</div>`}
function list(){let isP=page.includes('products'),isO=page.includes('orders')||page==='orders',isC=page.includes('customers');let base=isP?db.products.concat(db.products,db.products).slice(0,50):isO?db.orders.concat(db.orders,db.orders,db.orders).slice(0,50):isC?db.customers.concat(db.customers,db.customers,db.customers).slice(0,30):['Summer Edit','New Arrivals','Essentials','Travel Collection','VIP Customers','Standard Shipping','Online Store','Main Warehouse'];let rows=base.map((x,i)=>isP?[x,'SKU-'+(1048-i),'Active',i%4?'48 units':'Low stock','Apparel','Summer Edit','€'+(89+i*7)+'.00',12+i*3,'Sep '+(17-i%9)+', 2025']:isO?[x,'Sep '+(17-i%14)+', 2025',['Kasper Kristensen','Olivia Martin','Arthur Chen','Maya Patel'][i%4],'Online','Paid',i%4?'Shipped':'Processing',i%5+1,'€'+(89+i*31)+'.00']:isC?[x,x.toLowerCase().replace(' ','_')+'@example.com',i+2,'€'+(219+i*83)+'.00','€'+(86+i*4)+'.00','Sep '+(17-i%8)+', 2025','Registered','Active']:[x,(i+4)+' products','Sep '+(17-i%10)+', 2025','Online Store',i%5?'Active':'Draft']);let heads=isP?['Product','SKU','Status','Inventory','Category','Collection','Price','Sales','Updated']:isO?['Order','Date','Customer','Channel','Payment','Fulfillment','Items','Total']:isC?['Customer','Email','Orders','Total spent','AOV','Last order','Type','Status']:['Name','Products','Updated','Channel','Status'];return `${header('Search, filter, sort, save views and manage records.')}${metrics()}<div class="card"><div class="toolbar"><input class="search" id="search" placeholder="⌕ Search ${esc(title.toLowerCase())}…"><select class="select"><option>All statuses</option><option>Active</option><option>Draft</option><option>Archived</option></select><select class="select"><option>Sort by updated</option><option>Sort by name</option><option>Sort by status</option></select><button class="btn" data-action="saved">Saved views</button><button class="btn" data-action="columns">▤ Columns</button><span class="spacer"></span><button class="btn" data-action="import">↑ Import</button></div><div class="toolbar" id="bulk" style="display:none"><b>Selected records</b><span class="spacer"></span><button class="btn" data-action="bulk">Mark fulfilled</button><button class="btn" data-action="bulk">Add tags</button><button class="btn danger" data-action="bulk">Archive</button></div>${table(rows,heads)}</div>`}
function form(){let product=page.includes('product');return `${header('Complete the fields below and save your changes.')}${product?'<div class="page-tabs"><button class="page-tab active">Information</button><button class="page-tab">Media</button><button class="page-tab">Pricing</button><button class="page-tab">Inventory</button><button class="page-tab">Variants</button><button class="page-tab">SEO</button><button class="page-tab">Publishing</button></div>':''}<div class="section-grid wide"><div><div class="card"><div class="card-head"><h2>${product?'Information':'General information'}</h2></div><div class="card-body form"><div class="field"><label>Title / Name</label><input value="${esc(title.replace(/^(Create|Edit) /,''))}"></div><div class="field"><label>Subtitle</label><input placeholder="Short description for customers"></div><div class="field"><label>Description</label><textarea>Premium materials, considered details, and everyday utility.</textarea></div><div class="field"><label>Handle / URL</label><input value="store-item"></div></div></div>${product?`<div class="card" style="margin-top:14px"><div class="card-head"><h2>Pricing & inventory</h2></div><div class="card-body form"><div class="grid"><div class="field"><label>Price</label><input value="89.00"></div><div class="field"><label>Compare-at price</label><input value="109.00"></div><div class="field"><label>SKU</label><input value="SKU-1048"></div><div class="field"><label>Inventory quantity</label><input id="qty" value="100"></div></div><label class="switch"><input type="checkbox" checked> Track inventory</label></div></div><div class="card" style="margin-top:14px"><div class="card-head"><h2>Variants</h2><button class="btn" data-action="variants">Generate variants</button></div><div class="card-body" id="variants"><div class="grid"><div class="field"><label>Color options</label><input id="colors" value="Black, White"></div><div class="field"><label>Size options</label><input id="sizes" value="S, M, L"></div></div></div></div>`:''}</div><div><div class="card"><div class="card-head"><h2>Publishing</h2></div><div class="card-body form"><div class="field"><label>Status</label><select><option>Active</option><option>Draft</option><option>Archived</option></select></div><div class="field"><label>Sales channels</label><select><option>Online Store</option><option>POS</option><option>Wholesale</option></select></div><label class="switch"><input type="checkbox" checked> Visible in storefront</label><button class="btn primary" data-action="save">Save changes</button></div></div><div class="card" style="margin-top:14px"><div class="card-head"><h2>Search preview</h2></div><div class="card-body"><div class="callout"><b>FS Commerce</b><br>${esc(title)} · Your store</div></div></div></div></div>`}
function detail(){let order=page.includes('order-details');return `<div class="page-title"><div class="detail-head"><div><h1>${esc(title)}</h1><div class="sub">Sep 17, 2025, 2:56:31 PM from Default Sales Channel</div></div><span class="status">Paid</span><span class="status">Shipped</span></div><div class="actions"><button class="btn" data-action="json">View JSON</button><button class="btn" data-action="drawer">Edit</button><button class="btn danger" data-action="confirm">Cancel</button></div></div><div class="split"><div><div class="card"><div class="card-head"><h2>${order?'Summary':'Overview'}</h2><span class="status">Allocated</span></div>${order?`<div class="order-lines"><div class="line"><span class="thumb">▱</span><div><b>Bed frame</b><small class="muted">A-140×200 · Aluminum · 140×200</small></div><span>€1,000.00</span><span>1×</span><strong>€1,000.00</strong></div><div class="line"><span class="thumb">▱</span><div><b>Bed frame</b><small class="muted">R-140×200 · Red · 140×200</small></div><span>€1,000.00</span><span>2×</span><strong>€2,000.00</strong></div></div><div class="totals"><div class="total-row"><span>Items Total <span class="status gray">50%_OFF_PRODUCTS</span></span><span>€1,500.00</span></div><div class="total-row"><span>Shipping Total</span><span>€0.00</span></div><div class="total-row"><span>Tax Total</span><span>€150.00</span></div><div class="total-row"><span>Gift Cards / Credit</span><span>-€200.00</span></div><div class="total-row grand"><span>Total</span><span>€1,300.00</span></div></div>`:`<div class="card-body">${metrics()}<p>Product information, media, pricing, inventory, channels, sales and activity are available from the tabs below.</p></div>`}</div><div class="card" style="margin-top:14px"><div class="card-head"><h2>${order?'Payments':'Performance'}</h2><span class="status">Paid</span></div><div class="info-row"><label>Reference</label><span>01FT9SAZGFM88W5C3HB <button data-copy="01FT9SAZGFM88W5C3HB">⧉</button></span></div><div class="info-row"><label>Provider</label><span>Stripe · VISA *5545</span></div><div class="info-row"><label>Total</label><strong>€1,300.00</strong></div></div><div class="card" style="margin-top:14px"><div class="card-head"><h2>Returns / Notes / Metadata</h2></div><div class="card-body"><div class="callout">No open returns. Use View JSON to inspect developer metadata.</div></div></div></div><div><div class="card"><div class="card-head"><h2>${order?'Customer':'Product information'}</h2><span>···</span></div><div class="info-row"><label>ID</label><span>Kasper Kristensen <button data-copy="cus_01F">⧉</button></span></div><div class="info-row"><label>Contact information</label><span>kasper@medusajs.com<br>+4531903590</span></div><div class="info-row"><label>Shipping address</label><span>Vognmagergade 7<br>1120 Copenhagen<br>Denmark</span></div><div class="info-row"><label>Billing address</label><span>Same as shipping address</span></div></div><div class="card" style="margin-top:14px"><div class="card-head"><h2>Activity</h2></div>${timeline()}<div class="card-body"><button class="btn" data-toast="All activities loaded">Show more activities</button></div></div></div></div>`}
function analytics(){return `${header('Compare previous periods and identify opportunities.')}${metrics()}${chart()}<div class="grid" style="margin-top:14px">${['Revenue over time','Sales by channel','Top products','Traffic sources'].map(x=>`<div class="card"><div class="card-head"><h2>${x}</h2></div><div class="card-body"><strong>€18,402</strong><p class="muted">↑ 12.8% vs previous period</p></div></div>`).join('')}</div>`}function settings(){return `${header('Configure your store, team, and operational preferences.')}<div class="section-grid"><div class="card"><div class="card-head"><h2>Settings navigation</h2></div><div class="list">${['General','Store','Profile','Users','Roles','Regions','Markets','Tax Regions','Currencies','Sales Channels','Product Types','Product Tags','Locations','Shipping','Returns','Refunds','API Keys','Webhooks','Search','Notifications','Security','Integrations'].map(x=>`<a class="list-row" href="${({'General':'admin/settings-general.html/index,home','Store':'admin/settings-store.html/index,home','Profile':'admin/settings-users.html/index,home','Users':'admin/settings-users.html/index,home','API Keys':'admin/settings-api.html/index,home','Webhooks':'admin/settings-api.html/index,home','Notifications':'admin/settings-general.html/index,home','Security':'admin/settings-general.html/index,home','Team':'admin/settings-team.html/index,home'})[x]||'admin/settings-store.html/index,home'}"><div class="copy"><b>${x}</b><small>Manage ${x.toLowerCase()} settings</small></div><span>›</span></a>`).join('')}</div></div><div><div class="card"><div class="card-head"><h2>Store profile</h2></div><div class="card-body form"><div class="field"><label>Store name</label><input value="FS Commerce Main Store"></div><div class="field"><label>Store email</label><input value="hello@greencommerce.example"></div><div class="field"><label>Currency</label><select><option>EUR — Euro</option><option>USD — US Dollar</option></select></div><button class="btn primary" data-action="save">Save changes</button></div></div></div></div>`}
function render(){let out=kind==='home'?home():kind==='detail'?detail():kind==='form'?form():kind==='settings'?settings():kind==='analytics'?analytics():list();$('#page-content').innerHTML=out;bind()}
function openModal(h,b){$('#modalBox').innerHTML=`<div class="modal-head"><h2>${h}</h2><button class="close" data-close>×</button></div>${b}<div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="save">Save</button></div>`;$('#modal').classList.add('open');$$('#modal [data-close]').forEach(x=>x.onclick=()=>$('#modal').classList.remove('open'));$('#modal [data-action="save"]').onclick=()=>{$('#modal').classList.remove('open');toast('Saved successfully')}}function drawer(){let d=$('#drawer');d.innerHTML=`<div class="modal-head"><h2>Edit record</h2><button class="close" id="x">×</button></div><div class="form"><div class="field"><label>Name</label><input value="${esc(title)}"></div><div class="field"><label>Status</label><select><option>Active</option><option>Draft</option></select></div><div class="field"><label>Notes</label><textarea>Updated from the contextual drawer.</textarea></div><button class="btn primary" id="ds">Save changes</button></div>`;d.classList.add('open');$('#overlay').classList.add('open');$('#x').onclick=closeDrawer;$('#ds').onclick=()=>{closeDrawer();toast('Changes saved')}}function closeDrawer(){$('#drawer').classList.remove('open');$('#overlay').classList.remove('open')}
function csv(){let body='Name,Status,Updated\n'+db.products.map((x,i)=>`${x},Active,2025-09-${17-i}`).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/csv'}));a.download='greencommerce-export.csv';a.click();toast('CSV exported')}
function bind(){$$('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));$$('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy);toast('Copied to clipboard.')});$('#search')?.addEventListener('input',e=>$$('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'));$$('.row-check').forEach(c=>c.onchange=()=>$('#bulk').style.display=$$('.row-check:checked').length?'flex':'none');$('[data-all]')?.addEventListener('change',e=>{$$('.row-check').forEach(c=>c.checked=e.target.checked);$('#bulk').style.display=e.target.checked?'flex':'none'});$$('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='create')openModal('Create record','<div class="form"><div class="field"><label>Name</label><input placeholder="Enter a name"></div><div class="field"><label>Description</label><textarea></textarea></div></div>');if(a==='filter')drawer();if(a==='saved')openModal('Saved views','<div class="list"><div class="list-row">All records</div><div class="list-row">Unfulfilled</div><div class="list-row">High value</div><div class="list-row">My records</div></div>');if(a==='import')openModal('Import CSV','<div class="form"><div class="callout">Step 1 of 5 · Upload CSV</div><input type="file" accept=".csv"><div class="callout">Map columns → Preview → Validate → Import</div></div>');if(a==='columns'||a==='bulk')toast('Action applied');if(a==='save')toast('Saved successfully');if(a==='drawer')drawer();if(a==='confirm')openModal('Confirm action','<div class="callout">This demo action is reversible. Continue?</div>');if(a==='json')openModal('View JSON','<pre class="code">'+esc(JSON.stringify({id:'ord_01FT9',status:'shipped',total:1300,currency:'EUR'},null,2))+'</pre>');if(a==='variants'){let c=$('#colors').value.split(',').map(x=>x.trim()),s=$('#sizes').value.split(',').map(x=>x.trim()),v=c.flatMap(x=>s.map(y=>x+' / '+y));$('#variants').insertAdjacentHTML('beforeend','<div class="list">'+v.map((x,i)=>`<div class="list-row"><div class="copy"><b>${x}</b><small>SKU-${1048+i} · €89.00</small></div><span class="status">Active</span></div>`).join('')+'</div>');toast(v.length+' variants generated')}});$$('[data-export]').forEach(b=>b.onclick=csv);$$('.page-tab').forEach(t=>t.onclick=()=>{ $$('.page-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');toast(t.textContent+' tab selected')})}
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');db.theme=document.body.classList.contains('dark')?'dark':'light';save();toast('Theme updated')};$('#collapseBtn').onclick=()=>{$('#rail').classList.toggle('collapsed');$('#main').classList.toggle('shift')};$('#mobileBtn').onclick=()=>$('#rail').classList.toggle('open');$('#overlay').onclick=closeDrawer;$('#searchBtn').onclick=()=>openModal('Global search','<input class="search" autofocus placeholder="Search products, orders, customers…"><div class="list"><div class="list-row">Products · Linen Overshirt</div><div class="list-row">Orders · #2456</div><div class="list-row">Customers · Kasper Kristensen</div></div>');$('#commandBtn').onclick=()=>openModal('Command palette','<div class="list"><button class="list-row" data-toast="Create product opened">＋ Create product</button><button class="list-row" data-toast="Create order opened">＋ Create order</button><button class="list-row" data-toast="Analytics opened">⌁ Open analytics</button><button class="list-row" data-toast="Inventory opened">▤ Open inventory</button></div>');$('#globalSearch').onclick=()=>$('#searchBtn').click();document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchBtn').click()}if(e.key==='Escape'){$('#modal').classList.remove('open');closeDrawer()}});render();
</script>
</body></html>
